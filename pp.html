<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-Rex v3 — By YuongL</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:'Inter','Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#F8FAFC;
  color:#1E293B;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ============================================================
   SPLASH SCREEN
   ============================================================ */
#splash{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:radial-gradient(ellipse at 50% 35%,#0F1B3D 0%,#0A0E1A 55%,#05070D 100%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:opacity 0.8s cubic-bezier(0.4,0,0.2,1),visibility 0.8s cubic-bezier(0.4,0,0.2,1);
}
#splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* Particle canvas */
#particleCanvas{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}

/* Logo T-Rex */
.splash-logo{
  position:relative;
  z-index:2;
  width:110px;
  height:110px;
  margin-bottom:24px;
  opacity:0;
  transform:scale(0.3);
  animation:logoIn 1s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards;
}
@keyframes logoIn{
  to{opacity:1;transform:scale(1);}
}
.splash-logo svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 0 20px rgba(59,130,246,0.8)) drop-shadow(0 0 40px rgba(59,130,246,0.4));
}

/* App name */
.splash-title{
  position:relative;
  z-index:2;
  font-size:54px;
  font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(135deg,#3B82F6 0%,#60A5FA 50%,#F97316 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 30px rgba(59,130,246,0.5);
  opacity:0;
  transform:translateY(30px);
  animation:titleIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.6s forwards;
}
@keyframes titleIn{
  to{opacity:1;transform:translateY(0);}
}

/* Loading bar */
.splash-bar-wrap{
  position:relative;
  z-index:2;
  width:220px;
  height:3px;
  background:rgba(59,130,246,0.15);
  border-radius:3px;
  margin-top:30px;
  overflow:hidden;
  opacity:0;
  animation:fadeIn 0.5s ease 1s forwards;
}
.splash-bar{
  height:100%;
  width:0%;
  border-radius:3px;
  background:linear-gradient(90deg,#3B82F6,#60A5FA,#F97316);
  box-shadow:0 0 12px rgba(59,130,246,0.8);
  transition:width 0.3s ease;
}
@keyframes fadeIn{to{opacity:1;}}

/* Author signature */
.splash-author{
  position:relative;
  z-index:2;
  font-size:14px;
  color:#64748B;
  letter-spacing:3px;
  margin-top:26px;
  font-weight:400;
  opacity:0;
  min-height:20px;
}
.splash-author .cursor{
  display:inline-block;
  width:2px;
  height:14px;
  background:#3B82F6;
  margin-left:2px;
  animation:blink 0.8s infinite;
  vertical-align:middle;
}
@keyframes blink{
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}

/* ============================================================
   MAIN APP
   ============================================================ */
#app{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:#F8FAFC;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
#app.show{display:flex;}

/* Header */
.header{
  background:#FFFFFF;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 20px rgba(37,99,235,0.08);
  position:relative;
  z-index:10;
  flex-shrink:0;
  transition:box-shadow 0.3s ease;
}
.header.scrolled{
  box-shadow:0 6px 24px rgba(37,99,235,0.12);
}
.header h1{
  font-size:22px;
  font-weight:800;
  color:#1E293B;
  background:linear-gradient(135deg,#2563EB,#3B82F6);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:0.5px;
}
.header .ip-display{
  font-size:12px;
  color:#2563EB;
  font-weight:600;
  background:#EFF6FF;
  padding:6px 14px;
  border-radius:20px;
  box-shadow:0 2px 8px rgba(37,99,235,0.1);
  display:none;
  transition:all 0.3s ease;
}
.header .ip-display.show{
  display:block;
  animation:slideIn 0.4s ease;
}

/* Main scroll area */
.main-content{
  flex:1;
  overflow-y:auto;
  padding:16px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

/* Card */
.card{
  background:#FFFFFF;
  border-radius:16px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 4px 20px rgba(37,99,235,0.08);
  transition:box-shadow 0.3s ease,transform 0.2s ease;
  animation:cardIn 0.5s ease backwards;
}
.card:nth-child(1){animation-delay:0.05s;}
.card:nth-child(2){animation-delay:0.1s;}
.card:nth-child(3){animation-delay:0.15s;}
.card:nth-child(4){animation-delay:0.2s;}
.card:nth-child(5){animation-delay:0.25s;}
@keyframes cardIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
.card:hover{
  box-shadow:0 8px 30px rgba(37,99,235,0.14);
}
.card h3{
  font-size:15px;
  font-weight:700;
  color:#1E293B;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card h3 .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3B82F6;
  box-shadow:0 0 8px rgba(59,130,246,0.6);
  flex-shrink:0;
}

/* Toggle switch */
.toggle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
}
.toggle-row span{
  font-size:14px;
  color:#475569;
  font-weight:500;
}
.switch{
  position:relative;
  width:50px;
  height:28px;
  background:#CBD5E1;
  border-radius:14px;
  cursor:pointer;
  transition:background 0.3s ease;
  flex-shrink:0;
}
.switch.active{
  background:#3B82F6;
}
.switch::after{
  content:'';
  position:absolute;
  top:3px;
  left:3px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
}
.switch.active::after{
  transform:translateX(22px);
}

/* Range slider */
.range-wrap{padding:10px 0;}
.range-wrap label{
  font-size:13px;
  color:#64748B;
  display:block;
  margin-bottom:10px;
  font-weight:500;
}
.range-wrap label span{
  color:#2563EB;
  font-weight:700;
  font-size:15px;
}
input[type="range"]{
  width:100%;
  -webkit-appearance:none;
  appearance:none;
  height:6px;
  border-radius:6px;
  background:#E2E8F0;
  outline:none;
  cursor:pointer;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#3B82F6;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(37,99,235,0.4);
  transition:transform 0.15s ease,box-shadow 0.15s ease;
}
input[type="range"]::-webkit-slider-thumb:hover{
  transform:scale(1.1);
  box-shadow:0 4px 14px rgba(37,99,235,0.5);
}
input[type="range"]::-webkit-slider-thumb:active{
  transform:scale(1.2);
}
input[type="range"]::-moz-range-thumb{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#3B82F6;
  cursor:pointer;
  border:none;
  box-shadow:0 2px 10px rgba(37,99,235,0.4);
}

/* Input fields */
.input-group{margin-bottom:12px;}
.input-group label{
  font-size:12px;
  color:#64748B;
  display:block;
  margin-bottom:6px;
  font-weight:500;
}
.input-group input{
  width:100%;
  padding:12px 14px;
  border-radius:12px;
  border:1.5px solid #E2E8F0;
  background:#F8FAFC;
  font-size:14px;
  color:#1E293B;
  outline:none;
  transition:border-color 0.2s ease,box-shadow 0.2s ease,background 0.2s ease;
  font-family:inherit;
}
.input-group input:focus{
  border-color:#3B82F6;
  background:#FFFFFF;
  box-shadow:0 0 0 3px rgba(59,130,246,0.12);
}
.input-group input::placeholder{
  color:#94A3B8;
}

/* Buttons */
.btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s ease;
  letter-spacing:0.5px;
  font-family:inherit;
}
.btn-primary{
  background:linear-gradient(135deg,#2563EB,#3B82F6);
  color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,0.3);
}
.btn-primary:hover{
  box-shadow:0 6px 22px rgba(37,99,235,0.4);
  transform:translateY(-1px);
}
.btn-primary:active{
  transform:scale(0.97);
  box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.btn-danger{
  background:linear-gradient(135deg,#DC2626,#EF4444);
  color:#fff;
  box-shadow:0 4px 16px rgba(220,38,38,0.3);
}
.btn-danger:hover{
  box-shadow:0 6px 22px rgba(220,38,38,0.4);
  transform:translateY(-1px);
}
.btn-danger:active{
  transform:scale(0.97);
  box-shadow:0 2px 8px rgba(220,38,38,0.3);
}
.btn-outline{
  background:#EFF6FF;
  color:#2563EB;
  border:1.5px solid #BFDBFE;
}
.btn-outline:hover{
  background:#DBEAFE;
  border-color:#93C5FD;
}
.btn-outline:active{
  background:#BFDBFE;
  transform:scale(0.98);
}
.btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none;
}

/* Device scan result */
.scan-result{
  background:#EFF6FF;
  border-radius:12px;
  padding:14px 16px;
  margin-top:12px;
  display:none;
  align-items:center;
  gap:12px;
  border-left:3px solid #3B82F6;
  animation:slideIn 0.4s ease;
}
.scan-result.show{display:flex;}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-20px);}
  to{opacity:1;transform:translateX(0);}
}
.scan-result .dev-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#60A5FA);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#fff;
  font-weight:700;
  box-shadow:0 4px 12px rgba(59,130,246,0.3);
  flex-shrink:0;
  letter-spacing:0.5px;
}
.scan-result .dev-info{flex:1;min-width:0;}
.scan-result .dev-name{
  font-size:14px;
  font-weight:700;
  color:#1E293B;
}
.scan-result .dev-status{
  font-size:11px;
  color:#EF4444;
  font-weight:600;
  margin-top:2px;
}

/* Attack log */
.attack-log{
  max-height:160px;
  overflow-y:auto;
  background:#0F172A;
  border-radius:12px;
  padding:12px 14px;
  margin-top:12px;
  font-family:'Courier New',Consolas,monospace;
  font-size:11px;
  line-height:1.6;
  color:#22C55E;
  display:none;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.3);
}
.attack-log.show{display:block;}
.attack-log .line{
  opacity:0.9;
  margin-bottom:2px;
  word-break:break-all;
}
.attack-log .line.err{color:#EF4444;}
.attack-log .line.warn{color:#F59E0B;}
.attack-log .line.info{color:#60A5FA;}

/* Device list */
.device-list{
  display:none;
  flex-direction:column;
  gap:8px;
  margin-top:12px;
}
.device-list.show{display:flex;}
.device-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#F8FAFC;
  border-radius:12px;
  padding:12px 14px;
  border:1.5px solid #E2E8F0;
  animation:slideIn 0.4s ease;
  transition:border-color 0.2s ease,box-shadow 0.2s ease;
}
.device-item:hover{
  border-color:#BFDBFE;
  box-shadow:0 2px 10px rgba(37,99,235,0.08);
}
.device-item .icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:linear-gradient(135deg,#2563EB,#3B82F6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  color:#fff;
  font-weight:700;
  flex-shrink:0;
  letter-spacing:0.5px;
}
.device-item .info{flex:1;min-width:0;}
.device-item .name{
  font-size:13px;
  font-weight:600;
  color:#1E293B;
}
.device-item .sub{
  font-size:11px;
  color:#94A3B8;
  margin-top:1px;
}

/* Stats counter */
.stats-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.stat-box{
  background:#EFF6FF;
  border-radius:12px;
  padding:12px 8px;
  text-align:center;
  box-shadow:0 2px 10px rgba(37,99,235,0.06);
  transition:transform 0.2s ease;
}
.stat-box:hover{
  transform:translateY(-2px);
}
.stat-box .num{
  font-size:20px;
  font-weight:800;
  color:#2563EB;
  transition:color 0.2s ease;
}
.stat-box .lbl{
  font-size:10px;
  color:#64748B;
  margin-top:2px;
  font-weight:600;
  letter-spacing:0.5px;
}

/* Footer */
.footer{
  text-align:center;
  padding:20px 16px 24px;
  font-size:11px;
  color:#94A3B8;
  font-weight:500;
}
.footer span{
  color:#3B82F6;
  font-weight:700;
}

/* Toast notification */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#1E293B;
  color:#fff;
  padding:12px 24px;
  border-radius:12px;
  font-size:13px;
  font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,0.2);
  opacity:0;
  transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  z-index:10000;
  pointer-events:none;
  max-width:90%;
  text-align:center;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{
  background:#CBD5E1;
  border-radius:4px;
}
::-webkit-scrollbar-thumb:hover{
  background:#94A3B8;
}

/* Responsive */
@media (max-width:400px){
  .splash-title{font-size:42px;}
  .splash-logo{width:90px;height:90px;}
  .header h1{font-size:19px;}
  .card{padding:16px;}
  .stat-box .num{font-size:17px;}
}
@media (min-height:800px){
  .main-content{padding:20px;}
}
</style>
</head>
<body>

<!-- ============================================================
     SPLASH SCREEN
     ============================================================ -->
<div id="splash">
  <canvas id="particleCanvas"></canvas>
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- T-Rex outline -->
      <path d="M18 78 L18 56 Q18 46 26 43 L34 41 L34 30 Q34 22 42 20 L52 18 Q60 20 62 28 L64 38 L72 40 Q80 42 82 50 L84 60 L90 62 L90 70 L82 70 L82 80 L74 80 L74 70 L42 70 L42 80 L34 80 L34 70 L18 70 Z"
        fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Eye -->
      <circle cx="47" cy="28" r="2.5" fill="#3B82F6"/>
      <!-- Teeth -->
      <line x1="54" y1="38" x2="54" y2="34" stroke="#F97316" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="58" y1="38" x2="58" y2="35" stroke="#F97316" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Arm -->
      <path d="M40 54 L30 50 L28 54" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
      <!-- Tail -->
      <path d="M18 62 L8 58 L12 64" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="splash-title">T-Rex v3</div>
  <div class="splash-bar-wrap">
    <div class="splash-bar" id="splashBar"></div>
  </div>
  <div class="splash-author" id="splashAuthor"></div>
</div>

<!-- ============================================================
     MAIN APP
     ============================================================ -->
<div id="app">
  <div class="header" id="header">
    <h1>T-Rex v3</h1>
    <div class="ip-display" id="ipDisplay">0.0.0.0</div>
  </div>

  <div class="main-content" id="mainContent">

    <!-- System toggle -->
    <div class="card">
      <h3><span class="dot"></span>Hệ thống</h3>
      <div class="toggle-row">
        <span>Bật / Tắt T-Rex</span>
        <div class="switch" id="mainSwitch"></div>
      </div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="num" id="statPackets">0</div>
          <div class="lbl">PACKETS</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statRate">0</div>
          <div class="lbl">P/S</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statTime">0s</div>
          <div class="lbl">TIME</div>
        </div>
      </div>
    </div>

    <!-- Scan devices -->
    <div class="card">
      <h3><span class="dot"></span>Quét thiết bị bay</h3>
      <div class="range-wrap">
        <label>Phạm vi quét: <span id="rangeVal">50m</span></label>
        <input type="range" id="rangeScan" min="1" max="100" value="50">
      </div>
      <button class="btn btn-primary" id="btnScan" style="margin-top:10px;">QUÉT THIẾT BỊ</button>
      <div class="scan-result" id="scanResult">
        <div class="dev-icon">FLY</div>
        <div class="dev-info">
          <div class="dev-name">Fly Không Xác Định</div>
          <div class="dev-status">Đang hoạt động — Có thể tấn công</div>
        </div>
      </div>
    </div>

    <!-- Attack panel -->
    <div class="card">
      <h3><span class="dot"></span>Tấn công Fly</h3>
      <div class="input-group">
        <label>Chọn thiết bị</label>
        <input type="text" id="targetDevice" value="Fly Không Xác Định" readonly>
      </div>
      <div class="input-group">
        <label>Số luồng tấn công</label>
        <input type="number" id="threadCount" value="100" min="1" max="10000">
      </div>
      <button class="btn btn-danger" id="btnAttack">TẤN CÔNG</button>
      <div class="attack-log" id="attackLog"></div>
    </div>

    <!-- WiFi connect -->
    <div class="card">
      <h3><span class="dot"></span>Kết nối WiFi</h3>
      <div class="input-group">
        <label>Địa chỉ IP WiFi</label>
        <input type="text" id="wifiIP" placeholder="192.168.1.1" inputmode="decimal">
      </div>
      <div class="input-group">
        <label>Mật khẩu WiFi</label>
        <input type="password" id="wifiPass" placeholder="Nhập mật khẩu">
      </div>
      <button class="btn btn-primary" id="btnConnect">KẾT NỐI</button>
    </div>

    <!-- Search devices -->
    <div class="card">
      <h3><span class="dot"></span>Tìm kiếm thiết bị</h3>
      <button class="btn btn-outline" id="btnSearch">QUÉT LIÊN TỤC</button>
      <div class="device-list" id="deviceList"></div>
    </div>

    <div class="footer">T-Rex v3 — <span>By YuongL</span></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// PHONE SYSTEM — CORE
// ============================================================
(function(){
  'use strict';

  // ============================================================
  // PARTICLE BACKGROUND
  // ============================================================
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;
  let animationId = null;

  function resizeCanvas(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  for(let i = 0; i < 45; i++){
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      a: Math.random() * 0.5 + 0.2
    });
  }

  function drawParticles(){
    ctx.clearRect(0, 0, w, h);
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0) p.x = w;
      if(p.x > w) p.x = 0;
      if(p.y < 0) p.y = h;
      if(p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(59,130,246,' + p.a + ')';
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(59,130,246,0.5)';
      ctx.fill();
    }
    animationId = requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // ============================================================
  // SPLASH SCREEN LOGIC
  // ============================================================
  const splashBar = document.getElementById('splashBar');
  const splashAuthor = document.getElementById('splashAuthor');
  const splash = document.getElementById('splash');
  const app = document.getElementById('app');
  const authorText = 'By YuongL';
  let authorIdx = 0;
  let progress = 0;

  function typeWriter(){
    if(authorIdx < authorText.length){
      splashAuthor.innerHTML = authorText.substring(0, authorIdx + 1) + '<span class="cursor"></span>';
      authorIdx++;
      setTimeout(typeWriter, 80);
    } else {
      splashAuthor.innerHTML = authorText + '<span class="cursor"></span>';
    }
  }
  setTimeout(typeWriter, 1200);

  const progressInterval = setInterval(function(){
    progress += Math.random() * 12 + 3;
    if(progress >= 100){
      progress = 100;
      clearInterval(progressInterval);
      setTimeout(function(){
        splash.classList.add('hide');
        if(animationId) cancelAnimationFrame(animationId);
        setTimeout(function(){
          app.classList.add('show');
        }, 400);
      }, 300);
    }
    splashBar.style.width = progress + '%';
  }, 180);

  // ============================================================
  // MAIN APP LOGIC
  // ============================================================
  const mainSwitch = document.getElementById('mainSwitch');
  const rangeScan = document.getElementById('rangeScan');
  const rangeVal = document.getElementById('rangeVal');
  const btnScan = document.getElementById('btnScan');
  const scanResult = document.getElementById('scanResult');
  const btnAttack = document.getElementById('btnAttack');
  const attackLog = document.getElementById('attackLog');
  const threadCount = document.getElementById('threadCount');
  const btnConnect = document.getElementById('btnConnect');
  const wifiIP = document.getElementById('wifiIP');
  const wifiPass = document.getElementById('wifiPass');
  const ipDisplay = document.getElementById('ipDisplay');
  const btnSearch = document.getElementById('btnSearch');
  const deviceList = document.getElementById('deviceList');
  const statPackets = document.getElementById('statPackets');
  const statRate = document.getElementById('statRate');
  const statTime = document.getElementById('statTime');
  const toast = document.getElementById('toast');
  const header = document.getElementById('header');
  const mainContent = document.getElementById('mainContent');

  let systemOn = false;
  let attackInterval = null;
  let attackStartTime = 0;
  let packetCount = 0;
  let searchInterval = null;
  let isSearching = false;
  let toastTimeout = null;

  // ============================================================
  // TOAST NOTIFICATION
  // ============================================================
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    if(toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function(){
      toast.classList.remove('show');
    }, 2200);
  }

  // ============================================================
  // HEADER SHADOW ON SCROLL
  // ============================================================
  mainContent.addEventListener('scroll', function(){
    if(mainContent.scrollTop > 10){
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });

  // ============================================================
  // TOGGLE MAIN SWITCH
  // ============================================================
  mainSwitch.addEventListener('click', function(){
    systemOn = !systemOn;
    mainSwitch.classList.toggle('active', systemOn);
    showToast(systemOn ? 'T-Rex đã bật' : 'T-Rex đã tắt');
    if(!systemOn && attackInterval){
      clearInterval(attackInterval);
      attackInterval = null;
      btnAttack.textContent = 'TẤN CÔNG';
      attackLog.innerHTML += '<div class="line err">[!] Hệ thống tắt — dừng tấn công</div>';
      attackLog.scrollTop = attackLog.scrollHeight;
    }
  });

  // ============================================================
  // RANGE SCAN SLIDER
  // ============================================================
  rangeScan.addEventListener('input', function(){
    rangeVal.textContent = rangeScan.value + 'm';
  });

  // ============================================================
  // SCAN DEVICE
  // ============================================================
  btnScan.addEventListener('click', function(){
    if(!systemOn){
      showToast('Bật hệ thống T-Rex trước!');
      return;
    }
    btnScan.textContent = 'ĐANG QUÉT...';
    btnScan.disabled = true;
    scanResult.classList.remove('show');
    setTimeout(function(){
      btnScan.textContent = 'QUÉT THIẾT BỊ';
      btnScan.disabled = false;
      scanResult.classList.add('show');
      showToast('Đã tìm thấy thiết bị bay!');
    }, 1800);
  });

  // ============================================================
  // ATTACK PANEL
  // ============================================================
  btnAttack.addEventListener('click', function(){
    if(!systemOn){
      showToast('Bật hệ thống T-Rex trước!');
      return;
    }
    const threads = parseInt(threadCount.value) || 100;
    if(threads < 1 || threads > 10000){
      showToast('Số luồng phải từ 1-10000!');
      return;
    }

    if(attackInterval){
      clearInterval(attackInterval);
      attackInterval = null;
      btnAttack.textContent = 'TẤN CÔNG';
      attackLog.innerHTML += '<div class="line warn">[!] Đã dừng tấn công</div>';
      attackLog.scrollTop = attackLog.scrollHeight;
      showToast('Đã dừng tấn công');
      return;
    }

    btnAttack.textContent = 'DỪNG TẤN CÔNG';
    attackLog.classList.add('show');
    attackLog.innerHTML = '<div class="line info">[*] Bắt đầu tấn công Fly Không Xác Định...</div>';
    attackLog.innerHTML += '<div class="line info">[*] Số luồng: ' + threads + '</div>';
    attackStartTime = Date.now();
    packetCount = 0;
    showToast('Đang tấn công với ' + threads + ' luồng');

    let logCounter = 0;
    attackInterval = setInterval(function(){
      packetCount += threads * 100;
      statPackets.textContent = packetCount.toLocaleString('vi-VN');
      statRate.textContent = (threads * 100).toLocaleString('vi-VN');
      const elapsed = Math.floor((Date.now() - attackStartTime) / 1000);
      statTime.textContent = elapsed + 's';

      if(logCounter % 5 === 0){
        const line = document.createElement('div');
        line.className = 'line';
        line.textContent = '[+] Sent ' + threads + ' packets';
        attackLog.appendChild(line);
        attackLog.scrollTop = attackLog.scrollHeight;
        if(attackLog.children.length > 100){
          attackLog.removeChild(attackLog.firstChild);
        }
      }
      logCounter++;
    }, 100);
  });

  // ============================================================
  // CONNECT WIFI
  // ============================================================
  btnConnect.addEventListener('click', function(){
    const ip = wifiIP.value.trim();
    const pass = wifiPass.value.trim();
    if(!ip){
      showToast('Nhập địa chỉ IP WiFi!');
      return;
    }
    if(!pass){
      showToast('Nhập mật khẩu WiFi!');
      return;
    }
    const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
    if(!ipPattern.test(ip)){
      showToast('Địa chỉ IP không hợp lệ!');
      return;
    }
    const parts = ip.split('.');
    for(let i = 0; i < parts.length; i++){
      const num = parseInt(parts[i]);
      if(num < 0 || num > 255){
        showToast('Địa chỉ IP không hợp lệ!');
        return;
      }
    }

    btnConnect.textContent = 'ĐANG KẾT NỐI...';
    btnConnect.disabled = true;
    setTimeout(function(){
      btnConnect.textContent = 'KẾT NỐI';
      btnConnect.disabled = false;
      ipDisplay.textContent = ip;
      ipDisplay.classList.add('show');
      showToast('Đã kết nối WiFi: ' + ip);
    }, 1500);
  });

  // ============================================================
  // SEARCH DEVICES
  // ============================================================
  const mockDevices = [
    {name: 'Fly Unknow', sub: 'Thiết bị bay — Không xác định'},
    {name: 'Android 2020', sub: 'Điện thoại Android — 2020'},
    {name: 'Android 2018', sub: 'Điện thoại Android — 2018'},
    {name: 'Fly Unknow', sub: 'Thiết bị bay — Không xác định'},
    {name: 'Android 2021', sub: 'Điện thoại Android — 2021'},
    {name: 'Android 2019', sub: 'Điện thoại Android — 2019'},
    {name: 'Fly Unknow', sub: 'Thiết bị bay — Không xác định'},
    {name: 'Android 2022', sub: 'Điện thoại Android — 2022'}
  ];

  btnSearch.addEventListener('click', function(){
    if(isSearching){
      isSearching = false;
      clearInterval(searchInterval);
      searchInterval = null;
      btnSearch.textContent = 'QUÉT LIÊN TỤC';
      showToast('Đã dừng tìm kiếm');
      return;
    }

    isSearching = true;
    btnSearch.textContent = 'DỪNG TÌM KIẾM';
    deviceList.classList.add('show');
    deviceList.innerHTML = '';
    showToast('Đang quét thiết bị...');

    let idx = 0;
    searchInterval = setInterval(function(){
      if(idx >= mockDevices.length) idx = 0;
      const dev = mockDevices[idx];
      const item = document.createElement('div');
      item.className = 'device-item';
      const iconEl = document.createElement('div');
      iconEl.className = 'icon';
      iconEl.textContent = 'DEV';
      const infoEl = document.createElement('div');
      infoEl.className = 'info';
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = dev.name;
      const subEl = document.createElement('div');
      subEl.className = 'sub';
      subEl.textContent = dev.sub;
      infoEl.appendChild(nameEl);
      infoEl.appendChild(subEl);
      item.appendChild(iconEl);
      item.appendChild(infoEl);
      deviceList.appendChild(item);
      if(deviceList.children.length > 8){
        deviceList.removeChild(deviceList.firstChild);
      }
      idx++;
    }, 1200);
  });

})();
</script>
</body>
</html>
